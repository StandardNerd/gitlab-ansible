---
- name: Retrieve hostname and OS info from server
  hosts: gitlab-server
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  gather_facts: false
  vars_files:
    - ./credentials.yml

  tasks:
    - name: "Gather OS facts from target host"
      ansible.builtin.setup:
        gather_subset:
          - "distribution"
          - "os_family"

    - name: "Get the hostname"
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: "Display hostname and OS"
      ansible.builtin.debug:
        msg:
          - "Hostname : {{ hostname_result.stdout }}"
          - "OS       : {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
