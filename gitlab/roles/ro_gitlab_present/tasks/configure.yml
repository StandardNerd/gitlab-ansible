---
- name: "Configure: Copy GitLab configuration file"
  ansible.builtin.template:
    backup: true
    src: "gitlab.rb.j2"
    dest: "{{ gls_config_path }}"
    mode: '0600'
  notify: "Reconfigure GitLab"

- name: "Configure: Check if GitLab License file exists locally"
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ gitlab_license_file }}"
  delegate_to: localhost
  become: false
  register: _license_file_stat

- name: "Configure: Copy GitLab License file"
  ansible.builtin.copy:
    src: "{{ gitlab_license_file }}"
    dest: "/etc/gitlab/gitlab-license.json"
    mode: '0600'
  when: _license_file_stat.stat.exists

- name: "Configure: Force Reconfigure GitLab if configuration changed"
  ansible.builtin.meta: flush_handlers

- name: "Service: Ensure gitlab-runsvdir service is enabled and started"
  ansible.builtin.systemd:
    name: "{{ _gitlab_service_name | default('gitlab-runsvdir') }}"
    state: started
    enabled: true
  register: _runsvdir_result
  failed_when: false

- name: "Service: Display service status"
  ansible.builtin.debug:
    msg: >-
      gitlab-runsvdir service {{ 'is running'
        if (_runsvdir_result.status.ActiveState | default('')) == 'active'
        else 'not yet available (will start after first reconfigure)' }}
    verbosity: 1

- name: "Configure: Wait for GitLab to respond"
  ansible.builtin.uri:
    url: "{{ 'https' if gls_ssl_enabled | bool else 'http' }}://{{ '127.0.0.1' if molecule_test | bool else (gls_domain | default(ansible_host)) }}/-/readiness"
    status_code: 200
    validate_certs: false
    return_content: true
  register: _readiness_result
  retries: 30
  delay: 20
  until: _readiness_result.status == 200
  when: not (molecule_test | bool and (ansible_virtualization_type | default('') in ['docker', 'podman', 'container']))
  ignore_errors: true
...
