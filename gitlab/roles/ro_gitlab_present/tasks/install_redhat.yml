---
- name: "Install: Check installed packages"
  ansible.builtin.package_facts:

- name: "Install: Show installed GitLab version"
  ansible.builtin.debug:
    msg:
      - "GitLab is already installed"
      - "Version: {{ ansible_facts.packages[gitlab_package_name][0].version }}"
  when: gitlab_package_name in ansible_facts.packages

- name: "Install: Add GitLab YUM repository"
  ansible.builtin.shell: |
    curl -sS https://packages.gitlab.com/install/repositories/gitlab/{{ gitlab_package_name }}/script.rpm.sh | bash
  args:
    creates: "/etc/yum.repos.d/gitlab_{{ gitlab_package_name }}.repo"
  when: gitlab_package_name not in ansible_facts.packages

- name: "Install: Install GitLab on RedHat"
  ansible.builtin.dnf:
    name: "{{ gitlab_package_name }}{{ '-' + gls_version if gls_version != 'latest' else '' }}"
    state: present
    disable_gpg_check: true
  when: gitlab_package_name not in ansible_facts.packages
...
