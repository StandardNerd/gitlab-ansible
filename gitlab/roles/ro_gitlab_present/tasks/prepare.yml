---
- name: "Check dnf $releasever variable via Python"
  ansible.builtin.command: >
    python3 -c 'import dnf; db = dnf.Base(); db.conf.read(); print(db.conf.substitutions.get("releasever", "Unknown"))'
  register: dnf_releasever
  changed_when: false

- name: "Display the release version"
  ansible.builtin.debug:
    msg: "The detected RHEL release version is: {{ dnf_releasever.stdout | trim }}"

