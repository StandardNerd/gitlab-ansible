- name: Install python3-libdnf using raw command
  ansible.builtin.raw: dnf install -y python3-libdnf

- name: Install required dependencies
  ansible.builtin.dnf:
    name:
      - yum-utils
      - tar
      - tmux
      - which
      - lsof
      - curl
      - openssl
      - postfix
      - firewalld
      - python3-cryptography
      - python3-psycopg2
      - postgresql
    state: present
    use_backend: dnf4

- name: Start firewall daemon
  ansible.builtin.service:
    name: firewalld.service
    state: started
    enabled: true

- name: Open webserver ports
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - http
    - https

- name: Restart the firewall daemon
  ansible.builtin.service:
    name: firewalld.service
    state: restarted
  changed_when: false

    