---
# tasks/assert.yml — validate required variables before any action

- name: "Assert: gitlab_url is defined and non-empty"
  ansible.builtin.assert:
    that:
      - gitlab_url is defined
      - gitlab_url | length > 0
    fail_msg: >
      'gitlab_url' must be set to the URL of your GitLab instance.
      Example: gitlab_url: "https://gitlab.example.com"

- name: "Assert: Attempt to resolve registration token from GitLab server file (Option B)"
  ansible.builtin.slurp:
    src: "{{ gitlab_server_runner_token_file | default('/etc/gitlab/gitlab_runner_token') }}"
  delegate_to: "{{ gitlab_server_host | default('gitlab-server') }}"
  register: _assert_server_token_raw
  when:
    - gitlab_runner_token | default('') | length == 0
    - (gitlab_runner_registration_token | default('') | length == 0) or
      (gitlab_runner_registration_token == '4gcyYJNxXUxMZKji5WpA') or
      (gitlab_runner_registration_token == 'REPLACE_ME')
  ignore_errors: true
  no_log: true

- name: "Assert: Set registration token from slurped server file"
  ansible.builtin.set_fact:
    gitlab_runner_registration_token: "{{ (_assert_server_token_raw.content | b64decode | trim) }}"
  when:
    - _assert_server_token_raw is defined
    - _assert_server_token_raw.content is defined
    - (_assert_server_token_raw.content | b64decode | trim | length) > 0
  no_log: true

- name: "Assert: registration token is defined when no runner token is provided"
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token is defined
      - gitlab_runner_registration_token | length > 0
      - gitlab_runner_registration_token != "REPLACE_ME"
      - gitlab_runner_registration_token != "4gcyYJNxXUxMZKji5WpA"
    fail_msg: >
      'gitlab_runner_registration_token' must be set to the registration token
      from your GitLab instance (Admin > CI/CD > Runners) or be readable from
      '{{ gitlab_server_runner_token_file | default('/etc/gitlab/gitlab_runner_token') }}'
      on host '{{ gitlab_server_host | default('gitlab-server') }}'.
  when: gitlab_runner_token | default('') | length == 0

- name: "Assert: concurrent jobs value is a positive integer"
  ansible.builtin.assert:
    that:
      - gitlab_runner_concurrent | int > 0
    fail_msg: "'gitlab_runner_concurrent' must be a positive integer."

- name: "Assert: executor is a supported value"
  ansible.builtin.assert:
    that:
      - gitlab_runner_executor in ["shell", "docker", "docker+machine", "custom"]
    fail_msg: >
      'gitlab_runner_executor' must be one of: shell, docker, docker+machine, custom.
      Received: {{ gitlab_runner_executor }}

...
