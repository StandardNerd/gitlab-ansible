---
# tasks/configure.yml — create directories and render config.toml

- name: "Configure: Create GitLab Runner config directory"
  ansible.builtin.file:
    path: "{{ gitlab_runner_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "Configure: Create builds directory"
  ansible.builtin.file:
    path: "{{ gitlab_runner_builds_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Configure: Create cache directory"
  ansible.builtin.file:
    path: "{{ gitlab_runner_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Configure: Create certs directory"
  ansible.builtin.file:
    path: "{{ gitlab_runner_config_dir }}/certs"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Configure: Extract hostname from gitlab_url"
  ansible.builtin.set_fact:
    _gitlab_host: "{{ gitlab_url | regex_replace('^https?://', '') | regex_replace('(:[0-9]+)?(/.*)?$', '') }}"

- name: "Configure: Trust self-signed certificate from GitLab server"
  ansible.builtin.shell: |
    openssl s_client -showcerts -connect {{ _gitlab_host }}:443 </dev/null 2>/dev/null | openssl x509 -outform PEM > {{ gitlab_runner_config_dir }}/certs/{{ _gitlab_host }}.crt
  when: gitlab_url.startswith('https://')
  changed_when: false
  failed_when: false

# Render config.toml only when the file does not yet exist OR when the runner
# is not registered (token absent).  Once the runner is registered,
# GitLab Runner rewrites the file — we avoid overwriting it on every run.
- name: "Configure: Check if config.toml already exists"
  ansible.builtin.stat:
    path: "{{ _runner_config_path }}"
  register: _config_toml_stat

- name: "Configure: Render config.toml template"
  ansible.builtin.template:
    src: "config.toml.j2"
    dest: "{{ _runner_config_path }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
  when: not _config_toml_stat.stat.exists
  notify: "Restart gitlab-runner container"

...
