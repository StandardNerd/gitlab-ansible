---
# tasks/install_podman.yml — install Podman and required system packages

- name: "Podman: Gather package facts"
  ansible.builtin.package_facts:
    manager: auto

- name: "Podman: Install packages (RHEL / CentOS / Fedora)"
  ansible.builtin.dnf:
    name: "{{ _podman_pkgs }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: "Podman: Install packages (Debian / Ubuntu)"
  ansible.builtin.apt:
    name: "{{ _podman_pkgs }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: "Podman: Install packages (openSUSE / SLES)"
  community.general.zypper:
    name: "{{ _podman_pkgs }}"
    state: present
  when: ansible_os_family == "Suse"

# ---------------------------------------------------------------------------
# Enable the Podman socket so the runner container can talk to the container
# engine (required when using the "docker" executor with Podman)
# ---------------------------------------------------------------------------
- name: "Podman: Enable and start podman.socket (root)"
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
    daemon_reload: true
  when: gitlab_runner_enable_podman_socket | bool

- name: "Podman: Verify Podman is functional"
  ansible.builtin.command: podman info
  register: _podman_info
  changed_when: false
  failed_when: _podman_info.rc != 0

- name: "Podman: Display version"
  ansible.builtin.debug:
    msg: "Podman installed successfully. Info: {{ _podman_info.stdout_lines[0] }}"
    verbosity: 1

...
