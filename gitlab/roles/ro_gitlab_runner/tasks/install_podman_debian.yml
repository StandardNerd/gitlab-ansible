---
# tasks/install_podman_debian.yml

- name: "Prepare: Gather package facts"
  ansible.builtin.package_facts:
    manager: auto

- name: "Install: Install Podman packages (Debian)"
  ansible.builtin.apt:
    name: "{{ _podman_pkgs }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Install: Install AppArmor packages (Debian)"
  ansible.builtin.apt:
    name: "{{ _apparmor_packages }}"
    state: present
  when: gitlab_runner_configure_apparmor | bool

- name: "Configure: Ensure apparmor service is enabled and started"
  ansible.builtin.systemd:
    name: apparmor
    state: started
    enabled: true
  when: gitlab_runner_configure_apparmor | bool
  ignore_errors: true # In containers this might fail

- name: "Configure: Enable and start podman.socket (root)"
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
    daemon_reload: true
  when: gitlab_runner_enable_podman_socket | bool

- name: "Verify: Podman is functional"
  ansible.builtin.command: podman info
  register: _podman_info
  changed_when: false
  failed_when: _podman_info.rc != 0

- name: "Verify: Display version"
  ansible.builtin.debug:
    msg: "Podman installed successfully. Info: {{ _podman_info.stdout_lines[0] }}"
    verbosity: 1

...
