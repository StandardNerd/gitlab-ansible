---
# tasks/register.yml — register the runner with the GitLab instance

# ---------------------------------------------------------------------------
# Detect whether the runner is already registered by inspecting config.toml.
# A registered runner always has a [[runners]] section with a non-empty token.
# ---------------------------------------------------------------------------
- name: "Register: Read config.toml to detect existing registration"
  ansible.builtin.slurp:
    src: "{{ _runner_config_path }}"
  register: _config_toml_raw
  failed_when: false

- name: "Register: Parse runner token from config.toml"
  ansible.builtin.set_fact:
    _existing_runner_token: >-
      {{
        ((_config_toml_raw.content | b64decode)
        | regex_search('token\s*=\s*"([^"]+)"', '\1')
        | default([], true))
        | first
        | default('')
      }}
  when: _config_toml_raw.content is defined

- name: "Register: Set _existing_runner_token to empty when config absent"
  ansible.builtin.set_fact:
    _existing_runner_token: ""
  when: _config_toml_raw.content is not defined

- name: "Register: Check if custom TLS CA cert exists"
  ansible.builtin.stat:
    path: "{{ gitlab_runner_config_dir }}/certs/{{ _gitlab_host | default(gitlab_url | regex_replace('^https?://', '') | regex_replace('(:[0-9]+)?(/.*)?$', '')) }}.crt"
  register: _runner_cert_stat

- name: "Register: Read GitLab admin token from /tmp/token.txt"
  ansible.builtin.slurp:
    src: "{{ gitlab_admin_token_file | default('/tmp/token.txt') }}"
  delegate_to: "{{ gitlab_server_host | default('gitlab-server') }}"
  register: _admin_token_server_raw
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
  ignore_errors: true
  no_log: true

- name: "Register: Fallback to reading /tmp/token.txt from local host"
  ansible.builtin.slurp:
    src: "{{ gitlab_admin_token_file | default('/tmp/token.txt') }}"
  register: _admin_token_local_raw
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
    - _admin_token_server_raw.content is not defined
  ignore_errors: true

- name: "Register: Set gitlab_admin_token fact"
  ansible.builtin.set_fact:
    gitlab_admin_token: >-
      {{
        ((_admin_token_server_raw.content | default('')) | b64decode | trim)
        if (_admin_token_server_raw.content is defined and (_admin_token_server_raw.content | b64decode | trim | length > 0))
        else (((_admin_token_local_raw.content | default('')) | b64decode | trim)
              if (_admin_token_local_raw.content is defined and (_admin_token_local_raw.content | b64decode | trim | length > 0))
              else (gitlab_admin_token | default('')))
      }}
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
  no_log: true

- name: "Register: Enable runner registration token in GitLab settings (prevents 403 Forbidden)"
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/application/settings"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
    body_format: json
    body:
      allow_runner_registration_token: true
    validate_certs: false
    status_code: [200, 201]
  register: _gitlab_settings_api_result
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
    - gitlab_admin_token is defined
    - gitlab_admin_token | length > 0
  ignore_errors: true
  no_log: true

- name: "Register: Set registration token from GitLab application settings API response"
  ansible.builtin.set_fact:
    gitlab_runner_registration_token: "{{ _gitlab_settings_api_result.json.runners_registration_token }}"
  when:
    - _gitlab_settings_api_result.json is defined
    - _gitlab_settings_api_result.json.runners_registration_token is defined
    - (_gitlab_settings_api_result.json.runners_registration_token | length) > 0
  no_log: true

# ---------------------------------------------------------------------------
# Fallback: Read registration token from server file if API did not supply it
# ---------------------------------------------------------------------------
- name: "Register: Read registration token from GitLab server file fallback"
  ansible.builtin.slurp:
    src: "{{ gitlab_server_runner_token_file | default('/etc/gitlab/gitlab_runner_token') }}"
  delegate_to: "{{ gitlab_server_host | default('gitlab-server') }}"
  register: _register_server_token_raw
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
    - (gitlab_runner_registration_token | default('') | length == 0) or
      (gitlab_runner_registration_token == '4gcyYJNxXUxMZKji5WpA') or
      (gitlab_runner_registration_token == 'REPLACE_ME')
  ignore_errors: true
  no_log: true

- name: "Register: Set registration token from slurped server file or admin token"
  ansible.builtin.set_fact:
    gitlab_runner_registration_token: >-
      {{
        ((_register_server_token_raw.content | default('')) | b64decode | trim)
        if (_register_server_token_raw.content is defined and (_register_server_token_raw.content | b64decode | trim | length > 0))
        else (gitlab_admin_token | default(''))
      }}
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
    - (gitlab_runner_registration_token | default('') | length == 0) or
      (gitlab_runner_registration_token == '4gcyYJNxXUxMZKji5WpA') or
      (gitlab_runner_registration_token == 'REPLACE_ME')
  no_log: true

- name: "Register: Ensure registration token is valid before attempting registration"
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token is defined
      - gitlab_runner_registration_token | length > 0
      - gitlab_runner_registration_token != '4gcyYJNxXUxMZKji5WpA'
      - gitlab_runner_registration_token != 'REPLACE_ME'
    fail_msg: >
      Registration token could not be obtained. Neither 'gitlab_runner_registration_token'
      was set, nor could it be resolved via admin token from '/tmp/token.txt'
      or '{{ gitlab_server_runner_token_file | default('/etc/gitlab/gitlab_runner_token') }}'
      on host '{{ gitlab_server_host | default('gitlab-server') }}'.
    quiet: true
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0

# ---------------------------------------------------------------------------
# Register only when:
#   - no token found in config.toml  AND
#   - no pre-existing token was supplied via gitlab_runner_token
# ---------------------------------------------------------------------------
- name: "Register: Register runner with GitLab"
  ansible.builtin.command: >
    podman exec {{ gitlab_runner_container_name }}
    gitlab-runner register
    --non-interactive
    --url "{{ gitlab_url }}"
    --registration-token "{{ gitlab_runner_registration_token }}"
    --executor "{{ gitlab_runner_executor }}"
    --description "{{ gitlab_runner_name }}"
    --tag-list "{{ gitlab_runner_tags }}"
    --run-untagged="{{ gitlab_runner_run_untagged | lower }}"
    --locked="{{ gitlab_runner_locked | lower }}"
    {% if _runner_cert_stat.stat.exists | default(false) %}
    --tls-ca-file "/etc/gitlab-runner/certs/{{ _gitlab_host | default(gitlab_url | regex_replace('^https?://', '') | regex_replace('(:[0-9]+)?(/.*)?$', '')) }}.crt"
    {% endif %}
    {% if gitlab_runner_executor == 'docker' %}
    --docker-image "{{ gitlab_runner_default_image }}"
    --docker-privileged="{{ gitlab_runner_privileged | lower }}"
    {% for vol in gitlab_runner_volumes %}
    --docker-volumes "{{ vol }}"
    {% endfor %}
    {% endif %}
  register: _registration_result
  changed_when: "'Runner registered successfully' in _registration_result.stdout"
  failed_when:
    - _registration_result.rc != 0
    - "'already registered' not in _registration_result.stderr | default('')"
  when:
    - _existing_runner_token | length == 0
    - gitlab_runner_token | length == 0
  no_log: true   # Suppress token from logs

- name: "Register: Display registration outcome"
  ansible.builtin.debug:
    msg: >-
      {% if _existing_runner_token | length > 0 %}
      Runner is already registered (token found in config.toml). Skipping registration.
      {% elif _registration_result is skipped %}
      Registration skipped — a pre-existing token was supplied via 'gitlab_runner_token'.
      {% else %}
      Runner registered successfully with GitLab at {{ gitlab_url }}.
      {% endif %}

...
