---
# tasks/register.yml — register the runner with the GitLab instance

# ---------------------------------------------------------------------------
# Detect whether the runner is already registered by inspecting config.toml.
# A registered runner always has a [[runners]] section with a non-empty token.
# ---------------------------------------------------------------------------
- name: "Register: Read config.toml to detect existing registration"
  ansible.builtin.slurp:
    src: "{{ _runner_config_path }}"
  register: _config_toml_raw
  failed_when: false

- name: "Register: Parse runner token from config.toml"
  ansible.builtin.set_fact:
    _existing_runner_token: >-
      {{
        ((_config_toml_raw.content | b64decode)
        | regex_search('token\s*=\s*"([^"]+)"', '\1')
        | default([], true))
        | first
        | default('')
      }}
  when: _config_toml_raw.content is defined

- name: "Register: Set _existing_runner_token to empty when config absent"
  ansible.builtin.set_fact:
    _existing_runner_token: ""
  when: _config_toml_raw.content is not defined

- name: "Register: Check if custom TLS CA cert exists"
  ansible.builtin.stat:
    path: "{{ gitlab_runner_config_dir }}/certs/{{ _gitlab_host | default(gitlab_url | regex_replace('^https?://', '') | regex_replace('(:[0-9]+)?(/.*)?$', '')) }}.crt"
  register: _runner_cert_stat

# ---------------------------------------------------------------------------
# Register only when:
#   - no token found in config.toml  AND
#   - no pre-existing token was supplied via gitlab_runner_token
# ---------------------------------------------------------------------------
- name: "Register: Register runner with GitLab"
  ansible.builtin.command: >
    podman exec {{ gitlab_runner_container_name }}
    gitlab-runner register
    --non-interactive
    --url "{{ gitlab_url }}"
    {% if gitlab_runner_token | default('') | length > 0 %}
    --token "{{ gitlab_runner_token }}"
    {% else %}
    --registration-token "{{ gitlab_runner_registration_token }}"
    {% endif %}
    --executor "{{ gitlab_runner_executor }}"
    --description "{{ gitlab_runner_name }}"
    --tag-list "{{ gitlab_runner_tags }}"
    --run-untagged="{{ gitlab_runner_run_untagged | lower }}"
    --locked="{{ gitlab_runner_locked | lower }}"
    --request-concurrency {{ gitlab_runner_request_concurrency | default(gitlab_runner_concurrent) | int }}
    {% if _runner_cert_stat.stat.exists | default(false) %}
    --tls-ca-file "/etc/gitlab-runner/certs/{{ _gitlab_host | default(gitlab_url | regex_replace('^https?://', '') | regex_replace('(:[0-9]+)?(/.*)?$', '')) }}.crt"
    {% endif %}
    {% if gitlab_runner_executor == 'docker' %}
    --docker-image "{{ gitlab_runner_default_image }}"
    --docker-privileged="{{ gitlab_runner_privileged | lower }}"
    {% for vol in gitlab_runner_volumes %}
    --docker-volumes "{{ vol }}"
    {% endfor %}
    {% endif %}
  register: _registration_result
  changed_when: "'Runner registered successfully' in _registration_result.stdout"
  failed_when:
    - _registration_result.rc != 0
    - "'already registered' not in _registration_result.stderr | default('')"
  when:
    - _existing_runner_token | length == 0
    - (gitlab_runner_token | default('') | length > 0 or gitlab_runner_registration_token | default('') | length > 0)
  no_log: true   # Suppress token from logs

- name: "Register: Display registration outcome"
  ansible.builtin.debug:
    msg: >-
      {% if _existing_runner_token | length > 0 %}
      Runner is already registered (token found in config.toml). Skipping registration.
      {% elif _registration_result is skipped %}
      Registration skipped — a pre-existing token was supplied via 'gitlab_runner_token'.
      {% else %}
      Runner registered successfully with GitLab at {{ gitlab_url }}.
      {% endif %}

- name: "Register: Ensure listen_address is set in config.toml"
  ansible.builtin.lineinfile:
    path: "{{ _runner_config_path }}"
    regexp: '^listen_address\s*='
    line: 'listen_address = "{{ gitlab_runner_listen_address }}"'
    insertafter: '^concurrent\s*='
  when:
    - gitlab_runner_listen_address | default('') | length > 0
  notify: "Restart gitlab-runner container"

- name: "Register: Ensure session_server listen_address is set in config.toml"
  ansible.builtin.lineinfile:
    path: "{{ _runner_config_path }}"
    regexp: '^\s*listen_address\s*='
    line: '  listen_address = "{{ gitlab_runner_session_server_listen_address }}"'
    insertafter: '^\[session_server\]'
  when:
    - gitlab_runner_session_server_listen_address | default('') | length > 0
  notify: "Restart gitlab-runner container"

- name: "Register: Ensure session_server advertise_address is set in config.toml"
  ansible.builtin.lineinfile:
    path: "{{ _runner_config_path }}"
    regexp: '^\s*advertise_address\s*='
    line: '  advertise_address = "{{ gitlab_runner_session_server_advertise_address }}"'
    insertafter: '^\[session_server\]'
  when:
    - gitlab_runner_session_server_advertise_address | default('') | length > 0
  notify: "Restart gitlab-runner container"

- name: "Register: Ensure request_concurrency is set in [[runners]]"
  ansible.builtin.lineinfile:
    path: "{{ _runner_config_path }}"
    regexp: '^\s*request_concurrency\s*='
    line: '  request_concurrency = {{ gitlab_runner_request_concurrency | default(gitlab_runner_concurrent) | int }}'
    insertafter: '^\[\[runners\]\]'
  notify: "Restart gitlab-runner container"

- name: "Register: Verify runner status via GitLab REST API"
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/runners/all"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
    validate_certs: false
    status_code: 200
  register: _api_runners_list
  when:
    - gitlab_admin_token | default('') | length > 0
  failed_when: false
  changed_when: false

- name: "Register: Display verified runner status from GitLab API"
  ansible.builtin.debug:
    msg: "GitLab Runner '{{ gitlab_runner_name }}' status in GitLab Server: {{ (_api_runners_list.json | selectattr('description', 'equalto', gitlab_runner_name) | map(attribute='status') | first) | default('registered') }}."
  when:
    - _api_runners_list is defined
    - _api_runners_list.json is defined

...
