---
# vars/main.yml — internal role variables (not intended to be overridden)

# Full path to the rendered config.toml inside the container
_runner_config_path: "{{ gitlab_runner_config_dir }}/config.toml"

# Path to the Podman socket (root)
_podman_socket_path: "/run/podman/podman.sock"

# podman generate systemd output directory
_systemd_unit_dir: "/etc/systemd/system"

...
